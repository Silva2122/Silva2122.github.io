# Обратный прокси перед админкой: nginx держит TLS и порт 443, node слушает
# только 127.0.0.1:4180 и наружу вообще не торчит.
#
# Это конфиг ПОСЛЕ certbot — так он выглядит прямо сейчас на боевом сервере
# (`/etc/nginx/sites-enabled/axelnn`, IP 79.174.77.134, домен уже резолвится).
# Блоки с комментарием «managed by Certbot» дописал сам certbot при выпуске
# сертификата — руками их не трогать, certbot сам их обновит при продлении.
#
# Если разворачиваете с нуля: сначала используйте вариант БЕЗ этих блоков
# (только location / с proxy_pass, без 443 и без редиректа) — сертификата
# на старте ещё нет, а ssl_certificate на несуществующий файл роняет
# nginx -t целиком, и сайт не поднимется даже по http. Порядок:
#
#   1) поправить server_name на реальный домен
#   2) sudo cp deploy/nginx-axelnn.conf /etc/nginx/sites-available/axelnn
#      (взяв версию БЕЗ certbot-блоков — см. историю git до 2026-08-12,
#      либо просто убрать ssl_* строки и второй server{} ниже)
#   3) sudo ln -s /etc/nginx/sites-available/axelnn /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx   (сайт уже отвечает по http)
#   5) когда DNS переключат на IP сервера:
#      sudo certbot --nginx -d axelnn.ru -d www.axelnn.ru
#      — сам допишет всё, что ниже, и превратит файл в то, что видите сейчас

server {
    server_name axelnn.ru www.axelnn.ru;

    # Кадры товаров заливаются как есть, без сжатия на лету — лимит подняли
    # с 25 МБ (только фото) под видео из admin/video.mjs (до 70 МБ на входе,
    # см. MAX_INPUT там же).
    client_max_body_size 85m;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По этому заголовку сервер решает, ставить ли куку входа с Secure —
        # см. admin/auth.mjs:secureCookie(). Certbot дописал реальный https
        # ниже, так что теперь $scheme действительно бывает https.
        proxy_set_header X-Forwarded-Proto $scheme;
        # Сжатие видео через ffmpeg на одном ядре сервера может занять больше
        # дефолтных 60с nginx (см. admin/video.mjs) — без этого владелец
        # получал бы 504, пока сервер ещё честно досчитывал кадр.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    listen 443 ssl; # managed by Certbot
    listen [::]:443 ssl ipv6only=on; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/axelnn.ru/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/axelnn.ru/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

server {
    if ($host = www.axelnn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    if ($host = axelnn.ru) {
        return 301 https://$host$request_uri;
    } # managed by Certbot

    listen 80;
    listen [::]:80;
    server_name axelnn.ru www.axelnn.ru;
    # Запрос без Host: axelnn.ru/www.axelnn.ru (например, по голому IP)
    # ни под одно условие выше не попадает и проваливается сюда — это
    # осознанно у certbot, не баг: обращения по IP так и должны отваливаться.
    return 404; # managed by Certbot
}
