# Обратный прокси перед админкой: nginx держит TLS и порт 443, node слушает
# только 127.0.0.1:4180 и наружу вообще не торчит.
#
# Установка:
#   1) поправить server_name на реальный домен
#   2) sudo cp deploy/nginx-axelnn.conf /etc/nginx/sites-available/axelnn
#   3) sudo ln -s /etc/nginx/sites-available/axelnn /etc/nginx/sites-enabled/
#   4) sudo certbot --nginx -d axelnn.ru -d www.axelnn.ru   (сам допишет ssl_* строки)
#   5) sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    listen [::]:80;
    server_name axelnn.ru www.axelnn.ru;

    # certbot подменит этот блок на редирект на https после выпуска сертификата
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name axelnn.ru www.axelnn.ru;

    # ssl_certificate / ssl_certificate_key пропишет certbot

    # Кадры товаров заливаются как есть, без сжатия на лету — до 25 МБ,
    # как и лимит в admin/http.mjs. Меньше — фото не долетит до sharp.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По этому заголовку сервер решает, ставить ли куку входа с Secure —
        # см. admin/auth.mjs:secureCookie(). Без него владелец не остался бы
        # залогинен дольше одной вкладки.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
