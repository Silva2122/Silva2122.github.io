# Обратный прокси перед админкой: nginx держит TLS и порт 443, node слушает
# только 127.0.0.1:4180 и наружу вообще не торчит.
#
# Специально ТОЛЬКО один блок на 80-м порту, без блока 443: сертификата
# на старте ещё нет, а ssl_certificate на несуществующий файл — это
# nginx -t в минус и сайт не поднимется вообще. certbot --nginx сам
# допишет отдельный блок под 443 и сам заменит location на редирект —
# после того, как DNS домена уже смотрит на этот сервер (иначе валидация
# по HTTP-01 не пройдёт).
#
# Установка:
#   1) поправить server_name на реальный домен
#   2) sudo cp deploy/nginx-axelnn.conf /etc/nginx/sites-available/axelnn
#   3) sudo ln -s /etc/nginx/sites-available/axelnn /etc/nginx/sites-enabled/
#   4) sudo nginx -t && sudo systemctl reload nginx   (сайт уже отвечает по http)
#   5) когда DNS переключат на IP сервера:
#      sudo certbot --nginx -d axelnn.ru -d www.axelnn.ru

server {
    listen 80;
    listen [::]:80;
    server_name axelnn.ru www.axelnn.ru;

    # Кадры товаров заливаются как есть, без сжатия на лету — до 25 МБ,
    # как и лимит в admin/http.mjs. Меньше — фото не долетит до sharp.
    client_max_body_size 25m;

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # По этому заголовку сервер решает, ставить ли куку входа с Secure —
        # см. admin/auth.mjs:secureCookie(). certbot допишет $scheme как https
        # в новый 443-блок сам; здесь, пока сертификата нет, это всегда http.
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
